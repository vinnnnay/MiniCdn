# Fly.io deployment config for the MiniCDN routing layer.
#
# Deploy AFTER all 3 edge nodes are deployed (it needs their real URLs).
# Deploy from the REPO ROOT:
#   fly launch --config routing/fly.toml --no-deploy
#   fly secrets set EDGE_US_URL=https://minicdn-edge-us.fly.dev --config routing/fly.toml
#   fly secrets set EDGE_EU_URL=https://minicdn-edge-eu.fly.dev --config routing/fly.toml
#   fly secrets set EDGE_ASIA_URL=https://minicdn-edge-asia.fly.dev --config routing/fly.toml
#   fly deploy --config routing/fly.toml
#
# Pick one region for the routing layer itself — iad here, but it doesn't
# have to match any edge node's region. (Real anycast/DNS-based routing
# would run this logic at the network edge instead of one fixed location —
# see docs/implementation.md §4.3/§9 for that tradeoff discussion.)
app = "minicdn-routing"          # must be globally unique on Fly — change if taken
primary_region = "iad"

[build]
  dockerfile = "routing/Dockerfile"

[env]
  PORT = "5000"
  ROUTING_MODE = "proxy"
  HEALTH_POLL_INTERVAL_MS = "5000"
  # EDGE_US_URL / EDGE_EU_URL / EDGE_ASIA_URL are SECRETS — see above.
  # (They're not sensitive info, but Fly secrets vs. env vars both work
  # here — secrets just avoids them showing in `fly config show` by habit.
  # Fine to move these into [env] instead if you'd rather see them plainly.)

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
