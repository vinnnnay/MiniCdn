# Fly.io deployment config for the MiniCDN dashboard.
#
# Deploy LAST, after origin/edges/routing all have real URLs — the
# dashboard is a static site and needs those URLs baked in at BUILD time
# (Vite env vars), not passed as runtime secrets like the other services.
#
# Deploy from the REPO ROOT:
#   fly launch --config dashboard/fly.toml --no-deploy
#   fly deploy --config dashboard/fly.toml \
#     --build-arg VITE_ORIGIN_URL=https://minicdn-origin.fly.dev \
#     --build-arg VITE_ROUTING_URL=https://minicdn-routing.fly.dev \
#     --build-arg VITE_EDGE_US_URL=https://minicdn-edge-us.fly.dev \
#     --build-arg VITE_EDGE_EU_URL=https://minicdn-edge-eu.fly.dev \
#     --build-arg VITE_EDGE_ASIA_URL=https://minicdn-edge-asia.fly.dev
#
# Re-run that full `fly deploy --build-arg ...` command (not just `fly
# deploy`) any time a backend service's URL changes, since these are baked
# into the static JS bundle rather than read at runtime.
app = "minicdn-dashboard"        # must be globally unique on Fly — change if taken
primary_region = "iad"

[build]
  dockerfile = "dashboard/Dockerfile"

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
